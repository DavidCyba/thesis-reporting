<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page.title | default: site.title | escape }}</title>

    <!-- Atom Dark CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/atom-dark.css' | relative_url }}">

    <!-- Page layout -->
    <style>
        body {
            margin: 0;
        }

        .markdown-preview {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px;
            box-sizing: border-box;
        }
    </style>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            }
        };
    </script>

    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
    </script>
</head>

<body>
    <main class="markdown-preview">
        {{ content }}
    </main>
</body>

</html>
