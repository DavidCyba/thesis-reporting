<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page.title | default: site.title | escape }}</title>

    <!-- Atom Dark CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/atom-dark.css' | relative_url }}">

    <!-- Page layout -->
    <style>
        body {
            margin: 0;
            zoom: 1.15;
        }

        .markdown-preview {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px;
            box-sizing: border-box;
        }

        /* Code block styling */
        html body .markdown-preview pre,
        html body .markdown-preview .highlight pre {
            background-color: #303337;
            border-radius: 3px;
            padding: 1em;
            overflow-x: auto;
        }

        html body .markdown-preview pre code {
            background: transparent;
        }
        
        /* Self-hosted Inter font */
        @font-face {
            font-family: "Inter";
            src: url("{{ '/assets/fonts/InterVariable.woff2' | relative_url }}")
                format("woff2");
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        /* Document typography */
        html body {
            font-family: "Inter", "Helvetica Neue",
                        "Segoe UI", Arial, sans-serif;
        }
    </style>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            }
        };
    </script>

    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
    </script>
</head>

<body>
    <main class="markdown-preview">
        {{ content }}
    </main>
</body>

</html>
